# Deploy the CoolQBot introduction website and public data to GitHub Pages.
name: Deploy website to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/static.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Collect the website and upload it as the Pages artifact. This job is kept separate from
  # the deployment so the artifact lookup in the deploy job runs a few seconds later:
  # deploy-pages resolves the artifact name through the Actions results service, which can
  # lag behind the upload and is then only retried by a whole new run (actions/deploy-pages#451).
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Keep the website and its public JSON data under one Pages origin.
          path: "public/"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # The artifact can still be missing from the listing right after upload; retry below
        # instead of failing the run. Retrying deploy-pages does not upload a second artifact.
        continue-on-error: true

      - name: Wait for the artifact listing to catch up
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "Pages artifact not listed yet; retrying the deployment after a delay."
          sleep 60

      - name: Retry deploying to GitHub Pages
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
